# Wakefield Synthesizer - Default Color Theme
# Color values: 0-255 (256-color mode) or standard color names
# Standard colors: black, red, green, yellow, blue, magenta, cyan, white

[theme]
name = Default
author = Wakefield Team

# UI Element Colors (semantic names)
[colors]
# Text and backgrounds
text_normal = white
background = black

# Selection and focus
selection_fg = white
selection_bg = blue
cursor = cyan

# Parameter states
param_locked = red
param_modulated = green
param_midi_mapped = yellow

# UI chrome
tab_active_fg = white
tab_active_bg = blue
tab_inactive_fg = black
tab_inactive_bg = cyan

border = cyan
header = yellow
hint_text = yellow

# Status indicators
status_active = green
status_inactive = white
status_error = red
status_warning = yellow

# Waveform display (grayscale gradient for oscilloscope)
# These map to brightness levels 0-19 (darkest to brightest)
waveform_gradient = grayscale

# Special elements
midi_learn_popup_fg = yellow
midi_learn_popup_bg = black
popup_border = yellow

# Console messages
console_normal = white
console_error = red
console_warning = yellow
console_success = green
