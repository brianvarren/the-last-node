# Wakefield Synthesizer - Nord Theme
# Inspired by the Nord color palette
# https://www.nordtheme.com/

[theme]
name = Nord
author = Community

[colors]
# Text and backgrounds
text_normal = 216      # Light gray-blue
background = 235       # Dark blue-gray

# Selection and focus
selection_fg = 235
selection_bg = 109     # Frost blue
cursor = 109

# Parameter states
param_locked = 203     # Aurora red
param_modulated = 150  # Aurora green
param_midi_mapped = 222 # Aurora yellow

# UI chrome
tab_active_fg = 235
tab_active_bg = 109
tab_inactive_fg = 216
tab_inactive_bg = 238

border = 109
header = 222
hint_text = 180        # Muted purple

# Status indicators
status_active = 150
status_inactive = 245
status_error = 203
status_warning = 222

# Waveform display
waveform_gradient = grayscale

# Special elements
midi_learn_popup_fg = 222
midi_learn_popup_bg = 235
popup_border = 109

# Console messages
console_normal = 216
console_error = 203
console_warning = 222
console_success = 150
